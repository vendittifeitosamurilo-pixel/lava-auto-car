<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento - AutoCar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
}

header{
    background:linear-gradient(90deg,#8B0000,#ff0000);
    text-align:center;
    padding:20px;
    box-shadow:0 0 20px red;
}

.container{
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

.box{
    background:#1c1c1c;
    border:2px solid red;
    border-radius:15px;
    padding:30px;
}

h2{
    text-align:center;
    color:#ff4444;
    margin-bottom:20px;
}

.metodo{
    margin-bottom:20px;
}

input[type="radio"]{
    margin-right:10px;
}

.pagamento{
    margin-top:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    background:#2b2b2b;
    color:white;
}

.botao{
    display:block;
    width:100%;
    padding:15px;
    background:red;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.botao:hover{
    background:#ff3333;
}

.pix-box{
    display:none;
    text-align:center;
    margin-top:20px;
}

.cartao-box{
    display:none;
}
</style>
</head>
<body>

<header>
    <h1>💳 Pagamento AutoCar</h1>
</header>

        <div class="container">
          <div class="box">

          <h2>Escolha a Forma de Pagamento</h2>

          <div class="metodo">

          <button type="button" class="opcao" onclick="mostrarPix()">
        💠 PIX
          </button>

          <button type="button" class="opcao" onclick="mostrarCartao()">
        💳 Cartão
          </button>

        </div>

        <div class="pix-box" id="pixBox">
            <h3>Pagamento via PIX</h3>
            <br>
            <p>Chave PIX:</p>
            <strong>autocar@pix.com</strong>
            <br><br>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PagamentoAutoCar"
                 width="200">
        </div>

        <div class="cartao-box" id="cartaoBox">

            <input type="text" placeholder="Nome no Cartão">

            <input type="text" placeholder="Número do Cartão">

            <input type="text" placeholder="Validade (MM/AA)">

            <input type="text" placeholder="CVV">

        </div>

        <br>

       <a href="dashboard.html" class="botao">
             Finalizar Pedido
       </a>

    </div>
</div>

<script>
function mostrarPix(){
    document.getElementById("pixBox").style.display="block";
    document.getElementById("cartaoBox").style.display="none";
}

function mostrarCartao(){
    document.getElementById("cartaoBox").style.display="block";
    document.getElementById("pixBox").style.display="none";
}
</script>

</body>
</html>
