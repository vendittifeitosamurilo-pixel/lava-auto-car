<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contratar Serviço - AutoCar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
}

header{
    background:linear-gradient(90deg,#8B0000,#ff0000);
    padding:20px;
    text-align:center;
    box-shadow:0 0 20px red;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.box{
    background:#1c1c1c;
    border:2px solid red;
    border-radius:15px;
    padding:30px;
    box-shadow:0 0 20px rgba(255,0,0,0.3);
}

h2{
    text-align:center;
    color:#ff4444;
    margin-bottom:25px;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:none;
    border-radius:8px;
    background:#2b2b2b;
    color:white;
}

.botao{
    display:block;
    width:100%;
    padding:15px;
    background:red;
    color:white;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.botao:hover{
    background:#ff3333;
    box-shadow:0 0 20px red;
}

.voltar{
    display:inline-block;
    margin-top:20px;
    color:white;
    text-decoration:none;
}

.resumo{
    background:#2b2b2b;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.resumo h3{
    color:#ff4444;
}

footer{
    text-align:center;
    padding:20px;
    margin-top:40px;
    background:#0d0d0d;
}
</style>
</head>

<body>

<header>
    <h1>🚗 Contratação de Serviços</h1>
</header>

<div class="container">
    <div class="box">

        <h2>Solicitar Serviço</h2>

        <div class="resumo">
            <h3 id="nomeServico">Lavagem Simples</h3>
            <p id="precoServico">Valor: R$ 50,00</p>
        </div>

        <form>

            <label>Nome Completo</label>
            <input type="text" placeholder="Digite seu nome">

            <label>Telefone</label>
            <input type="tel" placeholder="(00) 00000-0000">

            <label>Modelo do Veículo</label>
            <input type="text" placeholder="Ex: Honda Civic">

            <label>Serviço</label>
            <select id="servicoSelect">
                <option value="simples">Simples - R$ 50</option>
                <option value="premium">Premium - R$ 70</option>
                <option value="completa">Completa - R$ 100</option>
            </select>

            <label>Forma de Pagamento</label>
            <select>
                <option>PIX</option>
                <option>Cartão de Crédito</option>
                <option>Cartão de Débito</option>
                <option>Dinheiro</option>
                <option>Boleto</option>
                <option>PayPal</option>
            </select>

            <a href="pagamento.html" class="botao">
                Finalizar Pedido
            </a>

        </form>

        <a href="dashboard.html" class="voltar">
            ← Voltar para o início
        </a>

    </div>
</div>

<footer>
    © 2026 Vende Lava AutoCar
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const servico = params.get("servico");

const select = document.getElementById("servicoSelect");
const nomeServico = document.getElementById("nomeServico");
const precoServico = document.getElementById("precoServico");

if(servico === "premium"){
    select.value = "premium";
    nomeServico.innerText = "✨ Lavagem Premium";
    precoServico.innerText = "Valor: R$ 70,00";
}

else if(servico === "completa"){
    select.value = "completa";
    nomeServico.innerText = "🧼 Lavagem Completa";
    precoServico.innerText = "Valor: R$ 100,00";
}

else{
    select.value = "simples";
    nomeServico.innerText = "🚿 Lavagem Simples";
    precoServico.innerText = "Valor: R$ 50,00";
}

select.addEventListener("change", function(){

    if(this.value === "simples"){
        nomeServico.innerText = "🚿 Lavagem Simples";
        precoServico.innerText = "Valor: R$ 50,00";
    }

    if(this.value === "premium"){
        nomeServico.innerText = "✨ Lavagem Premium";
        precoServico.innerText = "Valor: R$ 70,00";
    }

    if(this.value === "completa"){
        nomeServico.innerText = "🧼 Lavagem Completa";
        precoServico.innerText = "Valor: R$ 100,00";
    }

});

</script>

</body>
</html>
